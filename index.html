<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wanderlust AI - Travel Itinerary Generator</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="background-globes">
        <div class="globe globe-1"></div>
        <div class="globe globe-2"></div>
    </div>

    <div class="container">
        <header>
            <h1>Wanderlust AI</h1>
            <p>Your personalized journey starts here.</p>
        </header>

        <main>
            <form id="itineraryForm" class="glass-card">
                <div class="form-group">
                    <label for="destination">Destination</label>
                    <input type="text" id="destination" name="destination" placeholder="e.g., Kyoto, Japan" required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="days">Duration (Days)</label>
                        <input type="number" id="days" name="days" min="1" max="30" placeholder="5" required>
                    </div>
                    <div class="form-group">
                        <label for="travelers">Travelers</label>
                        <input type="number" id="travelers" name="travelers" min="1" max="20" placeholder="2" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="budget">Budget (Estimated)</label>
                        <div class="input-with-icon">
                            <span>$</span>
                            <input type="number" id="budget" name="budget" min="100" placeholder="1500" required>
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label>Mode of Travel Preference</label>
                    <div class="radio-group">
                        <label class="radio-card">
                            <input type="radio" name="mode" value="flight" checked>
                            <span class="card-content">✈️ Flight</span>
                        </label>
                        <label class="radio-card">
                            <input type="radio" name="mode" value="train">
                            <span class="card-content">🚄 Train</span>
                        </label>
                        <label class="radio-card">
                            <input type="radio" name="mode" value="car">
                            <span class="card-content">🚗 Car</span>
                        </label>
                        <label class="radio-card">
                            <input type="radio" name="mode" value="bus">
                            <span class="card-content">🚌 Bus</span>
                        </label>
                    </div>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="you@example.com" required>
                </div>

                <div class="form-group">
                    <label for="preferences">Additional Preferences (Optional)</label>
                    <textarea id="preferences" name="preferences" rows="3"
                        placeholder="Vegetarian food, museums, hiking..."></textarea>
                </div>

                <button type="submit" id="submitBtn">
                    <span class="btn-text">Generate Itinerary</span>
                    <span class="btn-loader" style="display: none;"></span>
                </button>
            </form>

            <div id="message" class="message-box" style="display: none;"></div>
        </main>

        <footer>
            <p>Powered by AI & n8n Automation</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>

</html>
